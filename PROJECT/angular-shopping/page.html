<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f3f3f3;
            margin: 0;
            padding: 0;
        }

        .styled-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px;
            position: relative;
            overflow: hidden;
            height: 80vh;
        }

        .text-content {
            max-width: 50%;
        }

        .text-content h2 {
            font-size: 36px;
            color: #ff6f61;
            font-family: 'Pacifico', cursive;
        }

        .text-content h1 {
            font-size: 48px;
            margin: 10px 0;
            color: #333;
            font-family: 'Poppins', sans-serif;
        }

        .text-content p {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 25px;
            transition: background 0.3s ease;
            font-size: 16px;
        }

        .start-shopping {
            background: linear-gradient(90deg, #ff6f61, #ff3d3d);
            color: white;
        }

        .play-video {
            background: white;
            color: #ff6f61;
            border: 2px solid #ff6f61;
        }

        .start-shopping:hover {
            background: linear-gradient(90deg, #ff3d3d, #ff1a1a);
        }

        .play-video:hover {
            background: #ff6f61;
            color: white;
        }

        .image-content {
            position: relative;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shape {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #ff6f61, #ff3d3d);
            border-radius: 70% 10% 60% 60%;
            transform: rotate(45deg);
            z-index: 1;
        }

        .styled-image {
            position: relative;
            z-index: 2;
            max-width: 80%;
            border-radius: 15px;
        }

        .icon-message {
            position: absolute;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 25px;
            font-size: 14px;
            color: #333;
            z-index: 3;
        }

        .icon-message img {
            width: 54px;
            height: 54px;
            margin-right: 8px;
        }

        .icon-message:nth-child(1) {
            top: 20%;
            right: 5%;
        }

        .icon-message:nth-child(2) {
            top: 40%;
            right: 5%;
        }

        .icon-message:nth-child(3) {
            top: 60%;
            right: 5%;
        }

        .icon-message:nth-child(4) {
            top: 80%;
            right: 5%;
        }
    </style>
</head>
<body>
    <section class="styled-section">
        <div class="text-content">
            <h2>Trendy Collection</h2>
            <h1>Let's Create 🔥 Your Own Style</h1>
            <p>Style is something each of us already has, all we need to do is find it. So, let’s find it out.</p>
            <div class="buttons">
                <a href="#" class="btn start-shopping">Start Shopping</a>
                <a href="#" class="btn play-video">Play Video</a>
            </div>
        </div>
        <div class="image-content">
            <div class="shape"></div>
            <img src="./frontend/public/assets/images/homebg.png" alt="Stylish Woman" class="styled-image">
            <div class="icon-message" style="top: 20%; right: 5%;">
                <img src="./frontend/public/assets/images/watches.png" alt="Watch">
                <span>Stylish Watches</span>
            </div>
            <div class="icon-message" style="top: 40%; right: 5%;">
                <img src="./frontend/public/assets/images/phone.png" alt="Phone">
                <span>Latest Phones</span>
            </div>
            <div class="icon-message" style="top: 60%; right: 5%;">
                <img src="./frontend/public/assets/images/laptopbg.png" alt="Laptop">
                <span>Modern Laptops</span>
            </div>
        </div>
    </section>
</body>
</html>
